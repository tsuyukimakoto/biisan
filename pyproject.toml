[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "biisan"
dynamic = ["version"]
description = "Static site generator for reStructuredText and Markdown"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Makoto Tsuyuki", email = "mtsuyuki@gmail.com" },
]
keywords = ["documentation", "markdown", "restructuredtext", "static-site-generator"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Documentation",
]
dependencies = [
  "docutils>=0.19,<0.24",
  "glueplate>=1.2,<2",
  "inquirer>=3.4.1,<4",
  "jinja2>=3.1.6,<4",
  "marko>=2.2.4,<3",
  "minify-html>=0.18.1,<0.19",
  "pyyaml>=6.0.2,<7",
]

[project.urls]
Homepage = "https://github.com/tsuyukimakoto/biisan"
Repository = "https://github.com/tsuyukimakoto/biisan"
Issues = "https://github.com/tsuyukimakoto/biisan/issues"

[dependency-groups]
dev = [
  "build>=1.3",
  "pyrefly>=0.42",
  "pytest>=9.0.3",
  "pytest-cov>=7.0",
  "ruff>=0.13",
  "twine>=6.2",
  "types-docutils>=0.22",
  "types-pyyaml>=6.0.12",
]

[tool.uv]
exclude-newer = "7 days"

[tool.hatch.version]
path = "src/biisan/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/biisan"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=src/biisan --cov-report=term-missing --cov-fail-under=85"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyrefly]
project-includes = ["src/**/*.py"]
search-path = ["src"]
